name: Deploy web a Hetzner

# El web/ es un sitio 100% estático (Vite) — se buildea acá y se sube por
# rsync al server, donde nginx lo sirve directo del filesystem (sin
# contenedor propio, sin necesidad de reiniciar nada).

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        # VITE_API_URL: "Repository variable" en GitHub (Settings →
        # Secrets and variables → Actions → Variables) — la URL pública
        # del backend en Hetzner.
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Cargar clave de deploy
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Confiar en el host del server
        run: ssh-keyscan -H ${{ vars.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      - name: Subir dist/ al server
        run: |
          rsync -avz --delete \
            web/dist/ \
            ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:~/stack/atenza-web/dist/
